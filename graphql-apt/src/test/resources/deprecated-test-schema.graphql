type Query {
  user(id: ID!, legacyId: ID @deprecated(reason: "use id instead")): User
  users(status: UserStatus): [User]
}

type Mutation {
  createUser(input: CreateUserInput!): User
}

type User {
  id: ID!
  name: String!
  email: String @deprecated(reason: "use emails instead")
  emails: [String]
  status: UserStatus
}

input CreateUserInput {
  name: String!
  email: String @deprecated(reason: "use emails instead")
  emails: [String]
}

enum UserStatus {
  ACTIVE
  INACTIVE
  BANNED @deprecated(reason: "no longer used")
}
